# Local stack in development mode: dev login, simulated clock, fake players.
# Usage: cp .env.example .env && docker compose up --build
# Then open http://localhost:8080 (API: /api/v1, dev tools: /dev).
name: nobodyfalls

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nobodyfalls}
      POSTGRES_USER: ${POSTGRES_USER:-nobodyfalls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-nobodyfalls};Username=${POSTGRES_USER:-nobodyfalls};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Database__MigrateOnStartup: "true"
      # Development only: tests and dev tools create many players from one machine.
      RateLimits__RegistrationsPerIpPerHour: "${REGISTRATIONS_PER_IP_PER_HOUR:-1000}"
      RateLimits__PerIpPerMinute: "${REQUESTS_PER_IP_PER_MINUTE:-3000}"
      DevTools__Enabled: "${DEV_TOOLS:-true}"
      Auth__SecureCookies: "false"
      Auth__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Auth__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Auth__Discord__ClientId: "${DISCORD_CLIENT_ID:-}"
      Auth__Discord__ClientSecret: "${DISCORD_CLIENT_SECRET:-}"
      Turnstile__SiteKey: "${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
      Turnstile__SecretKey: "${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
