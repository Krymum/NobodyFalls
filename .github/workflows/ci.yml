name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET build, format, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore NobodyFalls.slnx
          dotnet tool restore

      - name: Format
        run: dotnet format NobodyFalls.slnx --verify-no-changes --no-restore

      # Warnings are errors and analyzers run in the build (Directory.Build.props).
      - name: Build
        run: dotnet build NobodyFalls.slnx -c Release --no-restore

      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project src/NobodyFalls.Infrastructure --configuration Release --no-build

      # Infrastructure and API tests start PostgreSQL with Testcontainers (Docker is on the runner).
      - name: Test
        run: dotnet test --solution NobodyFalls.slnx -c Release --no-build

  web:
    name: Web typecheck, lint, tests, budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Build
        run: pnpm build

      # GAME_DESIGN §13: initial JavaScript ≤ 150 KB and CSS ≤ 30 KB, gzip.
      - name: Performance budgets
        run: pnpm budgets
